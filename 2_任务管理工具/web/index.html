<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f3ea" />
  <meta name="description" content="日序——把长期愿景、每周目标与每日行动连成一条温柔清晰的线。" />
  <title>Rixu Desktop</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/x-icon" sizes="any" href="../assets/rixu-hd.ico?v=hd-taskbar-3" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icon-32.png?v=hd-taskbar-3" />
  <link rel="icon" type="image/png" sizes="48x48" href="../assets/icon-48.png?v=hd-taskbar-3" />
  <script>window.__RIXU_BUILD__=new URLSearchParams(location.search).get('build')||String(Date.now());const rixuStyle=document.createElement('link');rixuStyle.rel='stylesheet';rixuStyle.href='./styles.css?v='+encodeURIComponent(window.__RIXU_BUILD__);document.head.appendChild(rixuStyle);</script>
</head>
<body>
  <div class="splash" id="splash" aria-hidden="true"><div class="splash-orbit"><img src="../assets/logo.svg" alt="" /></div><strong>日序</strong><span>把想做的事，慢慢变成今天</span></div>

  <section class="widget-app" id="widgetApp" aria-label="日序桌面小组件">
    <header class="widget-head drag-zone">
      <div class="widget-brand"><img src="../assets/logo.svg" alt="日序" /><div><strong>日序</strong><span id="widgetDate"></span></div></div>
      <div class="widget-head-actions no-drag"><button class="soft-icon pin-window" id="widgetTopmost" title="置顶窗口" aria-pressed="false"><svg class="pin-icon" viewBox="0 0 24 24" aria-hidden="true"><path class="pin-head" d="M9 3.5h6l-.8 4.3 2.5 3.4v1.6H7.3v-1.6l2.5-3.4L9 3.5Z"></path><path d="M12 12.8V21"></path></svg></button><button class="soft-icon" id="widgetRefresh" title="刷新今日">↻</button><button class="soft-icon close-widget" id="widgetClose" title="退出">×</button></div>
    </header>
    <div class="widget-hero"><div><p id="widgetGreeting">今天也要轻轻向前</p><h1 id="widgetFocusTitle">先完成最重要的一件事</h1></div><div class="progress-bubble"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="18"></circle><circle id="widgetProgressRing" cx="22" cy="22" r="18"></circle></svg><b id="widgetProgress">0%</b></div></div>
    <main class="widget-scroll" id="widgetSections"></main>
    <footer class="widget-footer no-drag"><a class="deep-button" id="deepManage" href="./index.html?manage=1" target="_blank"><span>✦</span> 深度管理 <i>→</i></a><span class="sync-hint"><i></i> 本机已保存</span></footer>
  </section>

  <div class="manager-app" id="managerApp">
    <aside class="manager-sidebar">
      <div class="manager-brand"><img src="../assets/logo.svg" alt="日序" /><div><strong>日序</strong><span>RIXU PLANNER</span></div></div>
      <nav id="managerNav">
        <button class="active" data-page="overview"><i>⌂</i><span>总览</span></button><button data-page="year"><i>◎</i><span>年度规划</span></button><button data-page="quarter"><i>◔</i><span>季度规划</span></button><button data-page="month"><i>☾</i><span>月度规划</span></button><button data-page="week"><i>◇</i><span>每周目标</span><b id="weekNavCount">0</b></button><button data-page="today"><i>✓</i><span>每日任务</span><b id="todayNavCount">0</b></button><button data-page="habits"><i>♧</i><span>习惯打卡</span></button><button data-page="reports"><i>☷</i><span>执行简报</span></button><button data-page="widget"><i>◫</i><span>桌面配置</span></button>
      </nav>
      <div class="sidebar-note"><span>一句提醒</span><p>不必一下子看到整条路，走好脚下这一小步。</p></div>
    </aside>
    <main class="manager-main">
      <header class="manager-topbar"><div class="manager-title-group"><button class="back-button hidden" id="backButton">← 返回总览</button><div><p id="managerDate"></p><h1 id="managerTitle">生活总览</h1></div></div><div class="manager-actions"><label class="search"><i></i><input id="globalSearch" placeholder="搜索目标与任务" /></label><button class="mode-button" id="pocketEntry" aria-label="打开口袋版" data-tooltip="打开口袋版"><i>◫</i><span>口袋版</span></button><button class="mode-button desktop-mode-button" id="desktopEntry" aria-label="固定到桌面" data-tooltip="固定到桌面"><i>⌂</i><span>固定桌面</span></button><button class="round-add" id="globalAdd" title="新建">＋</button><button class="exit-button" id="exitManager" title="退出日序">×</button></div></header>
      <section class="manager-content" id="managerContent"></section>
    </main>
  </div>

  <div class="modal-layer hidden" id="editorModal">
    <form class="editor-card" id="editorForm"><header><div><span id="editorEyebrow">添加内容</span><h2 id="editorHeading">记下一件重要的事</h2></div><button type="button" class="modal-x" data-close-modal>×</button></header><label><span>标题</span><input id="editorTitle" maxlength="100" required placeholder="想完成什么？" /></label><label id="editorNoteField"><span>补充说明</span><textarea id="editorNote" maxlength="300" rows="3" placeholder="写下原因、标准或下一步……"></textarea></label><div class="time-status-grid"><label><span id="editorDateLabel">执行时间</span><input id="editorDate" type="datetime-local" /></label><label class="status-field"><span>状态</span><select id="editorStatus"><option value="todo">待开始</option><option value="doing">进行中</option><option value="done">已完成</option></select></label></div><label id="editorEndField"><span>截至时间</span><input id="editorEndDate" type="datetime-local" /></label><label class="pin-field" id="editorPinField"><input id="editorPinned" type="checkbox" /><span><b>固定在桌面常驻</b><small>不受列表排序和日期变化影响</small></span></label><input id="editorType" type="hidden" /><input id="editorId" type="hidden" /><footer><button type="button" class="delete-button hidden" id="deleteItem">删除</button><span class="auto-save-state" id="autoSaveState" aria-live="polite">输入后自动保存</span><button type="button" class="ghost-button" data-close-modal>关闭</button><button class="save-button" type="submit">完成</button></footer></form>
  </div>
  <div class="share-layer hidden" id="reportShareModal">
    <section class="share-card" role="dialog" aria-modal="true" aria-labelledby="shareTitle"><header><div class="share-brand"><img src="../assets/logo.svg" alt="" /><div><span>RIXU SHARE</span><strong>分享今日进展</strong></div></div><button class="modal-x" type="button" data-close-share>×</button></header><div class="share-body"><figure><img id="sharePreview" alt="日序执行简报图片预览" /><figcaption>高清 PNG · 适合聊天与朋友圈</figcaption></figure><aside><span class="share-eyebrow">把看得见的进步分享出去</span><h2 id="shareTitle">选择一种轻松的分享方式</h2><p>推荐使用微信快捷分享：日序会复制图片并打开微信，你只需选择联系人后粘贴发送。</p><button class="wechat-share-button" id="shareToWechat"><i class="wechat-mark" aria-hidden="true"></i><span><b>复制图片并打开微信</b><small>进入聊天后按 Ctrl + V</small></span><em>→</em></button><div class="share-secondary"><button id="saveReportImage">↓ 保存 PNG</button><button id="systemShareImage">↗ 其他方式</button></div><div class="share-status" id="shareStatus" role="status"><i></i><span>图片仅保存在本机，不会上传服务器</span></div></aside></div></section>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script>const rixuScript=document.createElement('script');rixuScript.src='./app.js?v='+encodeURIComponent(window.__RIXU_BUILD__);document.body.appendChild(rixuScript);</script>
</body>
</html>
